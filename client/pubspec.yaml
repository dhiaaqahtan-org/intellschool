name: instikit_client
description: InstiKit School ERP Flutter client — offline-first, permission-gated, Arabic RTL.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Models / immutability
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.7.0
  retrofit: ^4.4.1

  # Local DB
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24

  # Routing
  go_router: ^14.2.7

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Key-value
  shared_preferences: ^2.3.2

  # i18n
  intl: ^0.19.0

  # Connectivity
  connectivity_plus: ^6.0.5

  # Realtime
  pusher_channels_flutter: ^2.3.0

  # Push
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Errors (functional)
  fpdart: ^1.1.0

  # Utils
  logger: ^2.4.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.13
  custom_lint: ^0.6.7
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.2
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true
  generate: true
